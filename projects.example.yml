groups:
  example_app:
    label: "Example App"
    description: "Example backend and frontend deployed through NearProd."
    components:
      - example_app_backend
      - example_app_frontend
    quick_links:
      frontend: "http://example.localhost"
      api: "http://api.example.localhost"

projects:
  example_app_backend:
    label: "Backend API"
    role: "backend"
    runner: "docker-compose"
    path: "~/Projects/example/backend"
    project_name: "example_app_backend"
    type: "api"
    urls:
      api: "http://api.example.localhost"

  example_app_frontend:
    label: "Frontend App"
    role: "frontend"
    runner: "docker-compose"
    path: "~/Projects/example/frontend"
    project_name: "example_app_frontend"
    type: "frontend"
    urls:
      frontend: "http://example.localhost"
      api: "http://api.example.localhost"
