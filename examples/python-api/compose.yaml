# Base = verify. No source bind mount, no dev command.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:${NEARPROD_DEMO_PORT:-18081}:8000"
    init: true
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
